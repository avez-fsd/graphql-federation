extend schema
@link(
    url: "https://specs.apollo.dev/federation/v2.0"
    import: ["@key", "@shareable"]
)

type Query {
    me: User
    user(id: ID!): User
}

type User @key(fields: "id") {
    id: ID!
    firstName: String
    lastName: String
    email: String
    age: Int
    isActive: Boolean
}